name: Unit Test

on: [push]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [
          "3.10",
          "3.11",
          "3.12",
          "3.13",
          ]
        django-version: [
          "django>=5.2,<5.3",
          "django>=6.0,<6.1",
        ]

        # Django 6.0 requires Python >= 3.12
        exclude:
          - python-version: "3.10"
            django-version: "django>=6.0,<6.1"
          - python-version: "3.11"
            django-version: "django>=6.0,<6.1"

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        pip install --upgrade pip setuptools wheel --quiet
        pip install "${{ matrix.django-version }}" --quiet
        pip install . --quiet
        pip install flake8
        pip install coverage

    - name: Analyze code with flake8
      continue-on-error: false
      run: |
        flake8

    - name: Django Unit Testing
      id: unittest
      continue-on-error: false
      run: |
        coverage run --source='.' quicktest.py django_classified

    - name: Generate Coverage Report
      run: |
        coverage report --show-missing

  clean-install:
    # The matrix job above runs `pip install --upgrade pip setuptools wheel`
    # before installing the package. setuptools ships a vendored copy of
    # distutils and registers an import hook for it, so on that machine any
    # dependency doing `import distutils` keeps working even on Python 3.12+,
    # where distutils was removed from the stdlib (PEP 632).
    #
    # Stock python:3.12/3.13 images ship pip and nothing else. That difference
    # hid an import-time failure in django-bootstrap-form through the whole 1.2.x
    # line: CI was green while `pip install django-classified` could not start on
    # a clean modern environment.
    #
    # This job installs the package and nothing else, asserts setuptools really is
    # absent, and only then runs the suite — so the environment users actually get
    # is the one being tested.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Install and test without setuptools present
      run: |
        docker run --rm -v "$PWD:/src" -w /src python:3.13-slim bash -euo pipefail -c '
          pip install . --quiet

          echo "--- runtime environment ---"
          pip list

          python - <<PY
        import importlib.util
        import sys

        if importlib.util.find_spec("setuptools") is not None:
            sys.exit(
                "setuptools is present in the runtime environment: this job can no "
                "longer detect distutils-style import regressions."
            )
        print("confirmed: no setuptools, no vendored distutils shim")
        PY

          python quicktest.py django_classified
        '
